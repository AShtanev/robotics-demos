<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robotics Demos</title>
<meta name="description" content="VR teleoperation, stage performances, voice control, autonomous navigation and data collection on Unitree humanoids and Go2.">
<style>
  :root{
    --bg:#0e0f12; --surface:#16181d; --surface-2:#1d2026; --line:#2a2e37;
    --text:#f2f3f5; --muted:#9aa1ad; --accent:#5cc8ff; --accent-dim:#2f6f8a;
    --radius:14px; --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px}

  header{padding:56px 0 34px; border-bottom:1px solid var(--line)}
  h1{margin:0 0 10px; font-size:clamp(28px,5.2vw,46px); line-height:1.12; letter-spacing:-.02em; font-weight:650}
  .lede{margin:0; color:var(--muted); font-size:clamp(15px,2.2vw,18px); max-width:62ch}
  .contacts{display:flex; gap:10px 22px; flex-wrap:wrap; margin:18px 0 0; padding:0; list-style:none; font-size:14px; color:var(--muted)}
  .contacts a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-dim)}
  .contacts a:hover{border-bottom-color:var(--accent)}
  .bar{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:26px}
  .brand{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
  .langs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px}
  .langs button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; font-weight:600; padding:6px 14px; border-radius:999px; cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--accent); color:#04121b}
  nav.toc{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:22px; font-size:14px}
  nav.toc a{color:var(--muted); text-decoration:none; border-bottom:1px solid transparent}
  nav.toc a:hover{color:var(--text); border-color:var(--accent)}

  section{padding:46px 0 10px; border-bottom:1px solid var(--line); scroll-margin-top:16px}
  section:last-of-type{border-bottom:0}
  .sec-head{display:flex; gap:16px; align-items:baseline; margin-bottom:6px}
  .num{color:var(--accent-dim); font-variant-numeric:tabular-nums; font-size:14px; font-weight:700; letter-spacing:.08em}
  h2{margin:0; font-size:clamp(21px,3.4vw,28px); letter-spacing:-.015em; font-weight:640}
  .sec-lede{margin:0 0 26px; color:var(--muted); max-width:66ch; font-size:15px}

  .grid{display:grid; gap:26px 22px; align-items:stretch; grid-template-columns:repeat(3,1fr)}
  .grid.vertical{grid-template-columns:repeat(4,1fr)}
  .grid.shots{grid-template-columns:repeat(3,1fr); align-items:start}
  .grid + .grid{margin-top:26px}

  figure{
    margin:0; grid-column:span var(--span,1);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .vbox{background:#000; aspect-ratio:16/9}
  .grid.vertical .vbox{aspect-ratio:9/16}
  video{display:block; width:100%; height:100%; object-fit:contain; background:#000}
  .ibox{display:block; background:#0b0c0f; max-height:560px; overflow:hidden; border-bottom:1px solid var(--line)}
  .ibox img{display:block; width:100%; height:auto}

  figcaption{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
  .cap-t{font-weight:620; font-size:15.5px; letter-spacing:-.01em}
  .cap-d{color:var(--muted); font-size:14px; margin:0}
  .dur{color:var(--accent-dim); font-size:12px; font-variant-numeric:tabular-nums; letter-spacing:.06em; margin-top:auto; padding-top:4px}

  footer{padding:44px 0 64px; color:var(--muted); font-size:14px}
  footer a{color:var(--accent); text-decoration:none}
  footer a:hover{text-decoration:underline}
  .note{margin-top:14px; font-size:13px; color:#6f7784}

  @media (max-width:1000px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .grid.vertical{grid-template-columns:repeat(3,1fr)}
    .grid.shots{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    header{padding:36px 0 26px}
    section{padding:34px 0 6px}
    .grid,.grid.vertical,.grid.shots{gap:20px; grid-template-columns:1fr}
    .grid + .grid{margin-top:20px}
    figure{--span:1}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="bar">
      <div class="brand">Robotics Demos</div>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <ul class="contacts" aria-label="Contacts">
      <li>Telegram: <a href="https://t.me/Ashtanev">@Ashtanev</a></li>
      <li>Email: <a href="mailto:shtanev.andrei@yandex.ru">shtanev.andrei@yandex.ru</a></li>
      <li>WhatsApp: <a href="https://wa.me/79645939653">+79645939653</a></li>
    </ul>
    <nav class="toc" id="toc"></nav>
  </header>

  <main id="main"></main>

  <footer>
    <p id="foot"></p>
    <p class="note" id="note"></p>
  </footer>

</div>

          { img:"webui-1-wifi", t:"Wi-Fi", d:"Link quality and one-tap network switching." },

    foot: "Открыты к сотрудничеству, в том числе с новыми типами роботов и производителями. Можем показать живое демо.",

          { f:"teleop-promo-g1d", t:"G1-D", d:"Unitree G1-D под управлением из VR-шлема.", dur:"1:38" },
          { f:"teleop-promo-moving-camera", t:"G1, движущаяся камера", d:"Собственное крепление камеры на голове для лучшего обзора.", dur:"1:04" },
          { f:"teleop-short-g1", t:"G1, короткий ролик", d:"G1 повторяет движения рук оператора.", dur:"0:11" },
          { f:"two-robots", t:"Два робота", d:"Демонстрация ловкости: телеоперация двух роботов.", dur:"0:37" },
          { f:"h2-teleop", t:"H2", d:"Гуманоид Unitree H2 под живым управлением из VR-шлема.", dur:"0:17" },

        ]},
      { id:"webui", t:"Веб-интерфейс телеоперации",
        l:"Админ-панель в браузере, работает на самом роботе: запуск и остановка сессии, Wi-Fi, камеры, лидар, звук, состояние моторов и доступ. Без терминала.",
        items:[
          { img:"webui-2-teleop", t:"Страница телеоперации", d:"Управление сессией, микрофон, динамик, уведомления в шлем, лидар, камера и состояние робота на одной странице." },
          { img:"webui-1-wifi", t:"Wi-Fi", d:"Качество связи и переключение сети в одно касание." },
          { img:"webui-4-lidar", t:"Лидар", d:"Живое облако точек, вид сверху." },
          { img:"webui-5-audio", t:"Звук", d:"Плеер, плейлисты и синтез речи на динамике робота." },
          { img:"webui-3-robot-health", t:"Состояние робота", d:"Батарея и температура обмоток каждого мотора, 75 Гц." },
          { img:"webui-6-security", t:"Безопасность", d:"Пароль администратора, PIN оператора, функции разработчика." },
          { img:"webui-7-logs", t:"Логи", d:"Выгрузка всех логов одним архивом." }
        ]},
      { id:"performance", t:"Выступления и движение",
        l:"Хореография снимается с человека, переносится на робота и исполняется живьём на сцене.",

          { f:"robot-dancer-making-of", t:"Robot Dancer, за кадром", d:"Захват движения хореографии и перенос на робота.", dur:"1:38" },

          { f:"live-event-teleop", t:"Живое мероприятие", d:"VR-телеоперация Unitree G1 на сцене перед публикой.", dur:"0:15" },

        ]},

          { f:"h2-voice-control", t:"Голосовое управление H2", d:"Unitree H2 выполняет голосовые команды, распознавание речи на борту.", dur:"0:30" }
        ]},

          { f:"go2-charging", t:"Go2 возвращается на зарядку", d:"Unitree Go2 завершает маршрут и сам заходит на зарядную станцию.", dur:"1:18" }
        ]}
      ,
      { id:"data", t:"Сбор данных и обучение",

        items:[

const PORTRAIT = new Set(["teleop-promo-g1d","teleop-promo-moving-camera","teleop-short-g1","two-robots","h2-teleop","h1",
  "symphony-of-innovations","live-event-teleop","custom-boxing-demo","h2-voice-control","go2-charging",
  "episode-recording","episode-recording-robot-view"]);

function caption(it){
  const cap = document.createElement("figcaption");
  const t = document.createElement("div"); t.className = "cap-t"; t.textContent = it.t;
  const p = document.createElement("p"); p.className = "cap-d"; p.textContent = it.d;
  cap.append(t, p);
  if (it.dur){ const du = document.createElement("div"); du.className = "dur"; du.textContent = it.dur; cap.append(du); }
  return cap;
}

function videoCard(it){
  const fig = document.createElement("figure");
  const box = document.createElement("div"); box.className = "vbox";
  const v = document.createElement("video");
  v.controls = true; v.preload = "none"; v.playsInline = true;
  v.poster = `posters/${it.f}.jpg`;
  v.src = `videos/${it.f}.mp4`;
  box.append(v);
  fig.append(box, caption(it));
  return fig;
}

function imageCard(it){
  const fig = document.createElement("figure");
  const a = document.createElement("a"); a.className = "ibox";
  a.href = `images/${it.img}.png`; a.target = "_blank"; a.rel = "noopener";
  const img = document.createElement("img"); img.src = a.href; img.alt = it.t; img.loading = "lazy";
  a.append(img);
  fig.append(a, caption(it));
  return fig;
}

function render(lang){
  const d = DATA[lang];
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = d.title;
  document.getElementById("lede").textContent  = d.lede;
  document.getElementById("foot").textContent  = d.foot;
  document.getElementById("note").textContent  = d.note;

  const toc = document.getElementById("toc"); toc.textContent = "";
  d.blocks.forEach(b => { const a = document.createElement("a"); a.href = `#${b.id}`; a.textContent = b.t; toc.append(a); });

  const main = document.getElementById("main");
  main.textContent = "";
  d.blocks.forEach((b, bi) => {
    const sec = document.createElement("section"); sec.id = b.id;
    const head = document.createElement("div"); head.className = "sec-head";
    const num = document.createElement("span"); num.className = "num";
    num.textContent = String(bi + 1).padStart(2, "0");
    const h2 = document.createElement("h2"); h2.textContent = b.t;
    head.append(num, h2);
    const lede = document.createElement("p"); lede.className = "sec-lede"; lede.textContent = b.l;
    sec.append(head, lede);

    const shots = b.items.filter(it => it.img);
    if (shots.length){
      const g = document.createElement("div"); g.className = "grid shots";
      shots.forEach(it => g.append(imageCard(it)));
      sec.append(g);
    }
    [["grid",          b.items.filter(it => it.f && !PORTRAIT.has(it.f))],
     ["grid vertical", b.items.filter(it => it.f &&  PORTRAIT.has(it.f))]
    ].forEach(([cls, items]) => {
      if (!items.length) return;
      const g = document.createElement("div"); g.className = cls;
      items.forEach(it => g.append(videoCard(it)));
      sec.append(g);
    });

    main.append(sec);
  });
}

document.querySelectorAll(".langs button").forEach(btn => {
  btn.addEventListener("click", () => {
    const lang = btn.dataset.lang;
    document.querySelectorAll(".langs button").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    render(lang);
    try { localStorage.setItem("rd-lang", lang); } catch (e) {}
  });
});

let start = "en";
try { const s = localStorage.getItem("rd-lang"); if (s === "ru" || s === "en") start = s; } catch (e) {}
if (start === "ru") {
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === "ru")));
}
render(start);
</script>
